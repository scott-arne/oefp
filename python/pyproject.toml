[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oefp"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openeye-toolkits>=2025.2",
]

[tool.setuptools]
packages = ["oefp"]

[tool.setuptools.package-data]
oefp = ["py.typed"]
