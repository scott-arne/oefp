[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oefp"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "openeye-toolkits>=2026.1",
    "pyarrow>=25,<26",
]

[tool.setuptools]
packages = ["oefp"]

[tool.setuptools.package-data]
oefp = ["mordred_references.json", "rdkit_references.json", "kallisto_references.json", "THIRD_PARTY_NOTICES", "py.typed"]
