[build-system]
# The pyarrow constraint must stay identical to the one in project.dependencies
# below: the extension links libarrow/libparquet out of whichever pyarrow the
# build resolves, by versioned soname, and pip only sees the runtime one.
requires = ["scikit-build-core>=0.8", "swig>=4.0", "pyarrow>=25,<26"]
build-backend = "scikit_build_core.build"

[project]
name = "oefp"
version = "0.3.0"
description = "Improved fingerprints for the OpenEye Toolkits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The floor is set by openeye-toolkits, not by anything in this package: 2026.1
# is the first release with py314 wheels and the first to drop py310, and the
# extension links its OpenEye shared libraries by versioned soname, so the
# runtime toolkit has to be the one the wheel was built against.
requires-python = ">=3.11"
authors = [
    { name = "Scott Arne Johnson", email = "scott.johnson@bms.com" },
]
keywords = ["chemistry", "openeye", "swig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
]
dependencies = [
    "numpy>=1.24",
    "openeye-toolkits>=2026.1",
    # Arrow is not vendored into the wheel: the extension resolves
    # libarrow/libparquet out of the sibling pyarrow package so Arrow C++
    # objects can cross the extension boundary without two Arrow runtimes in
    # one process. That makes the pyarrow major an ABI dependency, not a
    # feature dependency -- an unbounded `pyarrow>=24` here is what broke
    # `import oefp` when pyarrow 25 renamed libarrow.2400 to libarrow.2500.
    # Bump this and build-system.requires together, never one alone.
    "pyarrow>=25,<26",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.8",
    "pytest>=7.0",
    "rdkit>=2024.9",
    "ruff>=0.6",
    # The numeric-descriptor conformance suite compares against scipy's distance
    # implementations; without scipy those tests skip silently rather than fail.
    "scipy>=1.11",
    "vrzn>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "surechembl: opt-in large-scale canonical-identity sweep (needs local SureChEMBL parquet)",
]

[tool.ruff.lint.per-file-ignores]
"python/oefp/__init__.py" = ["E402"]
"python/oefp/_native.py" = ["F401"]

[tool.mypy]
exclude = [
    "^python/oefp/_build_info\\.py$",
    "^python/oefp/_native\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "oefp._build_info",
    "oefp._native",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "oecluster",
    "oecluster.*",
    "openeye",
    "openeye.*",
    "rdkit",
    "rdkit.*",
]
ignore_missing_imports = true

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
build.targets = ["oefp_python"]
wheel.install-dir = "."
logging.level = "INFO"
strict-config = false
wheel.py-api = "cp310"
wheel.exclude = ["**.pyc", "**/__pycache__", "*.a", "CMakeFiles/**"]

[tool.scikit-build.cmake.define]
OEFP_BUILD_TESTS = "OFF"
OEFP_BUILD_PYTHON = "ON"
OPENEYE_USE_SHARED = "ON"
OEFP_USE_STABLE_ABI = "ON"
OEFP_UNIVERSAL2 = "OFF"

# =============================================================================
# TOML-driven build configuration for scripts/build_python.py
# =============================================================================
# This section is read by build_python.py to parameterize the build.
# The script itself is identical across all projects — only this config changes.
[tool.oe-build]
package-name = "oefp"
cmake-test-flag = "OEFP_BUILD_TESTS"
rpath-strategy = "platform"  # "platform" = @loader_path/../openeye/libs/{platform}, "simple" = @loader_path

# External libraries that are expected to be missing from delocate.
# OpenEye is provided at runtime by openeye-toolkits; Arrow and Parquet are
# provided at runtime by pyarrow.
expected-missing-libs = [
    "liboechem", "liboegraphsim", "liboegrid", "liboesystem", "liboeplatform",
    "liboemath", "liboemolprop", "libzstd",
    "libarrow", "libparquet",
]

# Additional CMake defines passed during wheel build (beyond the standard ones)
[tool.oe-build.extra-cmake-defines]

# ----------------------------------------------------------------------------------------
# Pyright / Pylance configuration (type checking and editor analysis)
# https://microsoft.github.io/pyright/#/configuration
# ----------------------------------------------------------------------------------------
# Restrict analysis to this project's own source so Pylance does not crawl build
# artifacts, scratch data, vendored trees, or the interpreter's site-packages.
# Combined with the editor's workspace diagnostic mode this checks every project
# file (open or not) while keeping memory bounded.
[tool.pyright]
include = ["python", "tests"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "build",
    "build-*",
    "cmake-build-*",
    "dist",
    "**/*.egg-info",
]
