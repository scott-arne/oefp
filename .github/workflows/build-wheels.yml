name: Build Wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GCS_BUCKET: openeye-sdks
  # Single source of truth for the OpenEye release used by every job. This used
  # to come from a GitHub repository variable, which made the pin invisible from
  # the repo and let it rot out of step with what actually exists in the bucket.
  OPENEYE_VERSION: "2026.1.0"
  # The extension links libarrow/libparquet out of the pyarrow wheel by
  # versioned soname, so the pyarrow used to build must be the pyarrow used at
  # runtime. Keep this constraint identical to the `pyarrow` entries in
  # pyproject.toml (both build-system.requires and project.dependencies);
  # bumping to a new pyarrow major means changing all three together.
  PYARROW_REQUIREMENT: "pyarrow>=25,<26"

  # pypi.anaconda.org hosts the OpenEye channel and periodically stalls for
  # GitHub-hosted runners. pip's 15 s default read timeout turns that into a
  # hard build failure on an index that is otherwise healthy, so give it room
  # to ride out a slow edge. Set here rather than per-command so every pip
  # invocation in the workflow, including those inside the Linux containers,
  # picks it up.
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  build-linux:

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        # SDK filenames are spelled out rather than interpolated from
        # OPENEYE_VERSION: the env context is not available in strategy.matrix,
        # so ${{ env.* }} would expand to an empty string and the download would
        # 404. Keep these in step with OPENEYE_VERSION above.
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: rockylinux:8
            sdk: OpenEye-toolkits-2026.1.0-redhat-RHEL8-g++8.5-x64.tar.gz
            python: python3.11
            dnf_repo: powertools
            manylinux_plat: manylinux_2_28_x86_64
            # rockylinux:8 ships gcc 8.5, which predates <span> (gcc 10+);
            # pyarrow headers require C++20, so use the newer toolset.
            gcc_toolset: gcc-toolset-12

          # The ARM SDK is an Ubuntu 22.04 build but the container is Rocky 9;
          # that pairing is deliberate and is what produced the published
          # manylinux_2_34_aarch64 wheels.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: rockylinux:9
            sdk: OpenEye-toolkits-2026.1.0-Ubuntu-22.04-g++11.11-aarch64.tar.gz
            python: python3.11
            dnf_repo: crb
            manylinux_plat: manylinux_2_34_aarch64
            # rockylinux:9 ships gcc 11, which already provides <span>.
            gcc_toolset: ''

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    steps:
      - name: Install prerequisites
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled ${{ matrix.dnf_repo }}
          dnf install -y --allowerasing \
            git curl unzip gcc gcc-c++ cmake ninja-build \
            python3.11 python3.11-devel \
            zlib-devel cairo findutils
          if [ -n "${{ matrix.gcc_toolset }}" ]; then
            dnf install -y "${{ matrix.gcc_toolset }}"
          fi

      - uses: actions/checkout@v6

      - name: Setup Python environment
        run: |
          ${{ matrix.python }} -m venv /opt/venv
          echo "/opt/venv/bin" >> $GITHUB_PATH
          /opt/venv/bin/pip install --upgrade pip setuptools wheel
          /opt/venv/bin/pip install scikit-build-core ninja cmake build swig auditwheel patchelf "${{ env.PYARROW_REQUIREMENT }}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Download OpenEye SDK from GCS
        run: |
          mkdir -p /opt/openeye
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${{ env.GCS_BUCKET }}/${{ matrix.sdk }}" \
            -o /tmp/sdk.tar.gz
          tar -xzf /tmp/sdk.tar.gz -C /opt/openeye --strip-components=2
          rm /tmp/sdk.tar.gz
          ls -la /opt/openeye/

      - name: Download OpenEye license from GCS
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${{ env.GCS_BUCKET }}/oe_license.txt" \
            -o /opt/openeye/oe_license.txt
          echo "OE_LICENSE=/opt/openeye/oe_license.txt" >> $GITHUB_ENV

      - name: Install openeye-toolkits Python package
        run: |
          /opt/venv/bin/pip install openeye-toolkits==${{ env.OPENEYE_VERSION }} \
            --extra-index-url https://pypi.anaconda.org/openeye/simple \
            --no-cache-dir
          echo "--- Verifying openeye-toolkits installation ---"
          /opt/venv/bin/pip show openeye-toolkits
          /opt/venv/bin/python -c "from openeye import oechem; print('OpenEye version:', oechem.OEToolkitsGetRelease())"

      - name: Build wheel
        env:
          OPENEYE_ROOT: /opt/openeye
        run: |
          if [ -n "${{ matrix.gcc_toolset }}" ]; then
            . "/opt/rh/${{ matrix.gcc_toolset }}/enable"
            echo "Using $(gcc --version | head -1)"
          fi
          /opt/venv/bin/python scripts/build_python.py \
            --openeye-root /opt/openeye \
            --python /opt/venv/bin/python \
            --verbose

      - name: Repair wheel for manylinux
        run: |
          OE_LIB_DIR=$(/opt/venv/bin/python -c \
            "from openeye import libs; print(libs.FindOpenEyeDLLSDirectory())")
          EXCLUDE_ARGS=""
          for lib in "$OE_LIB_DIR"/lib*.so; do
            EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude $(basename $lib)"
          done
          # POSIX sh has no process substitution; recent rockylinux:8 images
          # ship without bash, so GitHub runs these steps under /bin/sh. Iterate
          # over the pyarrow directories with command substitution instead (the
          # paths contain no spaces).
          for pyarrow_lib_dir in $(/opt/venv/bin/python -c "import pyarrow as pa; print(' '.join(pa.get_library_dirs()))"); do
            for lib in "$pyarrow_lib_dir"/lib*.so*; do
              [ -e "$lib" ] || continue
              EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude $(basename "$lib")"
            done
          done
          PYARROW_LD_LIBRARY_PATH=$(/opt/venv/bin/python -c "import pyarrow as pa; print(':'.join(pa.get_library_dirs()))")
          LD_LIBRARY_PATH="$OE_LIB_DIR:$PYARROW_LD_LIBRARY_PATH" auditwheel repair \
            $EXCLUDE_ARGS \
            --plat ${{ matrix.manylinux_plat }} \
            --wheel-dir dist-repaired/ \
            dist/oefp-*.whl
          rm dist/oefp-*.whl
          mv dist-repaired/*.whl dist/

      - name: Fix RPATH for OpenEye shared libraries
        run: |
          OE_PLATFORM=$(/opt/venv/bin/python -c \
            "from openeye import libs; import os; print(os.path.basename(libs.FindOpenEyeDLLSDirectory()))")
          WHEEL=$(ls dist/oefp-*.whl)
          TMPDIR=$(mktemp -d)
          unzip -q "$WHEEL" -d "$TMPDIR"
          SO_FILE=$(find "$TMPDIR" -name '_oefp*.so' | head -1)
          if [ -n "$SO_FILE" ]; then
            patchelf --add-rpath '$ORIGIN' "$SO_FILE"
            patchelf --add-rpath '$ORIGIN/../pyarrow' "$SO_FILE"
            patchelf --add-rpath "\$ORIGIN/../openeye/libs/$OE_PLATFORM" "$SO_FILE"
            echo "RPATH set to: $(patchelf --print-rpath "$SO_FILE")"
          fi
          rm "$WHEEL"
          /opt/venv/bin/python -m wheel pack "$TMPDIR" -d dist/
          rm -rf "$TMPDIR"

      - name: Validate abi3 link table
        run: |
          # The wheel advertises cp310-abi3; the extension must resolve Python
          # symbols against the stable ABI rather than a versioned libpython,
          # otherwise it silently stops loading on the next Python minor.
          WHEEL=$(ls dist/oefp-*.whl)
          case "$WHEEL" in
            *cp310-abi3*) echo "OK: wheel tagged cp310-abi3" ;;
            *) echo "::error::wheel is not tagged cp310-abi3: $WHEEL"; exit 1 ;;
          esac
          TMP=$(mktemp -d)
          unzip -q "$WHEEL" -d "$TMP"
          SO_FILE=$(find "$TMP" -name '_oefp*.so' | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "::error::no _oefp extension found in wheel"; exit 1
          fi
          readelf -d "$SO_FILE" | grep NEEDED > libs.txt || true
          cat libs.txt
          if grep -Eq 'libpython3\.[0-9]+' libs.txt; then
            echo "::error::abi3 wheel links a versioned Python library"
            grep -E 'libpython3\.[0-9]+' libs.txt
            exit 1
          fi
          echo "OK: extension links no versioned Python library"

      - name: Validate Arrow soname against installed pyarrow
        run: |
          # Arrow is deliberately not vendored: the extension loads libarrow /
          # libparquet out of the sibling pyarrow package so Arrow C++ objects
          # can cross the extension boundary. That makes the recorded soname a
          # hard runtime coupling, and pip cannot see it. oefp 0.2.8 shipped
          # linked to libarrow.2400 with an unbounded `pyarrow>=24` dependency
          # and stopped importing the day pyarrow 25 landed. Fail here instead:
          # every Arrow soname the extension needs must exist in the pyarrow
          # that project.dependencies actually resolves to.
          WHEEL=$(ls dist/oefp-*.whl)
          TMP=$(mktemp -d)
          unzip -q "$WHEEL" -d "$TMP"
          SO_FILE=$(find "$TMP" -name '_oefp*.so' | head -1)
          readelf -d "$SO_FILE" | grep NEEDED \
            | grep -oE '(libarrow|libparquet)[a-z_]*\.so(\.[0-9]+)*' | sort -u > needed.txt
          if [ ! -s needed.txt ]; then
            echo "::error::extension links no Arrow library; the pyarrow linkage broke"
            exit 1
          fi
          cat needed.txt
          status=0
          for soname in $(cat needed.txt); do
            found=0
            for dir in $(/opt/venv/bin/python -c "import pyarrow as pa; print(' '.join(pa.get_library_dirs()))"); do
              [ -e "$dir/$soname" ] && found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::$soname is not in the installed pyarrow; the build and runtime pyarrow majors disagree"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          /opt/venv/bin/python -c "import pyarrow; print('OK: Arrow sonames match pyarrow', pyarrow.__version__)"

      - name: Test wheel
        run: |
          /opt/venv/bin/pip install pytest
          /opt/venv/bin/pip install dist/oefp-*.whl
          /opt/venv/bin/pytest tests/python/ -v -s

      - name: List built artifacts
        run: |
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist/*.whl
          retention-days: 2
  build-macos:

    permissions:
      contents: read
      id-token: write

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          brew install swig
          pip install --upgrade pip setuptools wheel
          pip install scikit-build-core ninja cmake build delocate "${{ env.PYARROW_REQUIREMENT }}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Download OpenEye SDK from GCS
        run: |
          mkdir -p ${{ runner.temp }}/openeye
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${{ env.GCS_BUCKET }}/OpenEye-toolkits-${{ env.OPENEYE_VERSION }}-macOS-14-clang++16-universal.tar.gz" \
            -o /tmp/sdk.tar.gz
          tar -xzf /tmp/sdk.tar.gz -C ${{ runner.temp }}/openeye --strip-components=2
          rm /tmp/sdk.tar.gz
          ls -la ${{ runner.temp }}/openeye/

      - name: Download OpenEye license from GCS
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${{ env.GCS_BUCKET }}/oe_license.txt" \
            -o ${{ runner.temp }}/openeye/oe_license.txt
          echo "OE_LICENSE=${{ runner.temp }}/openeye/oe_license.txt" >> $GITHUB_ENV

      - name: Install openeye-toolkits Python package
        run: |
          pip install openeye-toolkits==${{ env.OPENEYE_VERSION }} \
            --extra-index-url https://pypi.anaconda.org/openeye/simple \
            --no-cache-dir
          echo "--- Verifying openeye-toolkits installation ---"
          pip show openeye-toolkits
          python -c "from openeye import oechem; print('OpenEye version:', oechem.OEToolkitsGetRelease())"

      - name: Build wheel
        env:
          OPENEYE_ROOT: ${{ runner.temp }}/openeye
        run: |
          python scripts/build_python.py \
            --openeye-root ${{ runner.temp }}/openeye \
            --python $(which python) \
            --verbose

      - name: Validate abi3 link table
        run: |
          # The wheel advertises cp310-abi3; the extension must resolve Python
          # symbols against the stable ABI rather than a versioned libpython,
          # otherwise it silently stops loading on the next Python minor.
          WHEEL=$(ls dist/oefp-*.whl)
          case "$WHEEL" in
            *cp310-abi3*) echo "OK: wheel tagged cp310-abi3" ;;
            *) echo "::error::wheel is not tagged cp310-abi3: $WHEEL"; exit 1 ;;
          esac
          TMP=$(mktemp -d)
          unzip -q "$WHEEL" -d "$TMP"
          SO_FILE=$(find "$TMP" -name '_oefp*.so' | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "::error::no _oefp extension found in wheel"; exit 1
          fi
          otool -L "$SO_FILE" > libs.txt
          cat libs.txt
          if grep -Eq 'libpython3\.[0-9]+|Python\.framework' libs.txt; then
            echo "::error::abi3 wheel links a versioned Python library"
            grep -E 'libpython3\.[0-9]+|Python\.framework' libs.txt
            exit 1
          fi
          echo "OK: extension links no versioned Python library"

      - name: Validate Arrow install names against installed pyarrow
        run: |
          # See the matching Linux step: Arrow is loaded from the sibling
          # pyarrow package rather than vendored, so the versioned dylib name
          # baked into the extension has to exist in the pyarrow that
          # project.dependencies resolves to. This is the check that oefp 0.2.8
          # (linked to libarrow.2400.dylib, declaring `pyarrow>=24`) needed.
          WHEEL=$(ls dist/oefp-*.whl)
          TMP=$(mktemp -d)
          unzip -q "$WHEEL" -d "$TMP"
          SO_FILE=$(find "$TMP" -name '_oefp*.so' | head -1)
          otool -L "$SO_FILE" \
            | grep -oE '(libarrow|libparquet)[a-z_]*(\.[0-9]+)*\.dylib' | sort -u > needed.txt
          if [ ! -s needed.txt ]; then
            echo "::error::extension links no Arrow library; the pyarrow linkage broke"
            exit 1
          fi
          cat needed.txt
          status=0
          for dylib in $(cat needed.txt); do
            found=0
            for dir in $(python -c "import pyarrow as pa; print(' '.join(pa.get_library_dirs()))"); do
              [ -e "$dir/$dylib" ] && found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::$dylib is not in the installed pyarrow; the build and runtime pyarrow majors disagree"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          python -c "import pyarrow; print('OK: Arrow install names match pyarrow', pyarrow.__version__)"

      - name: Test wheel
        run: |
          pip install pytest
          pip install dist/oefp-*.whl
          pytest tests/python/ -v -s

      - name: List built artifacts
        run: |
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-universal2
          path: dist/*.whl
          retention-days: 2

  build-windows:

    permissions:
      contents: read
      id-token: write

    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # ilammy/msvc-dev-cmd still ships with `using: node20`; opt in to Node.js 24
      # so the action keeps working past GitHub's June 2 2026 cutover without
      # waiting on an upstream release.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install scikit-build-core ninja cmake build swig pytest "${{ env.PYARROW_REQUIREMENT }}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Download OpenEye SDK from GCS
        run: |
          mkdir -p "${RUNNER_TEMP}/openeye-extract"
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${{ env.GCS_BUCKET }}/OpenEye-toolkits-${{ env.OPENEYE_VERSION }}-win-x64-MD.zip" \
            -o "${RUNNER_TEMP}/sdk.zip"
          unzip -q "${RUNNER_TEMP}/sdk.zip" -d "${RUNNER_TEMP}/openeye-extract"
          rm "${RUNNER_TEMP}/sdk.zip"
          sdk_inner=$(find "${RUNNER_TEMP}/openeye-extract" -maxdepth 1 -mindepth 1 -type d | head -n1)
          echo "OPENEYE_ROOT=${sdk_inner}" >> $GITHUB_ENV
          ls "${sdk_inner}"

      - name: Download OpenEye license from GCS
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${{ env.GCS_BUCKET }}/oe_license.txt" \
            -o "${RUNNER_TEMP}/oe_license.txt"
          echo "OE_LICENSE=${RUNNER_TEMP}/oe_license.txt" >> $GITHUB_ENV

      - name: Install openeye-toolkits Python package
        run: |
          pip install "openeye-toolkits==${{ env.OPENEYE_VERSION }}" \
            --extra-index-url https://pypi.anaconda.org/openeye/simple \
            --no-cache-dir
          echo "--- Verifying openeye-toolkits installation ---"
          pip show openeye-toolkits
          python -c "from openeye import oechem; print('OpenEye version:', oechem.OEToolkitsGetRelease())"

      - name: Build wheel
        run: |
          python scripts/build_python.py \
            --openeye-root "${OPENEYE_ROOT}" \
            --python "$(which python)" \
            --verbose

      - name: Validate abi3 import table
        run: |
          # The wheel advertises cp310-abi3-win_amd64; the compiled .pyd must
          # link python3.dll (stable ABI) and must NOT link python3XX.dll
          # (versioned), otherwise the wheel silently breaks on any Python
          # minor other than the build Python.
          WHEEL=$(ls dist/oefp-*.whl)
          TMPDIR=$(mktemp -d)
          unzip -q "$WHEEL" -d "$TMPDIR"
          PYD=$(find "$TMPDIR" -name '_oefp*.pyd' | head -1)
          if [ -z "$PYD" ]; then
            echo "::error::_oefp*.pyd not found in wheel"
            exit 1
          fi
          dumpbin //dependents "$PYD" > deps.txt
          cat deps.txt
          if grep -Eiq '\bpython3[0-9]+\.dll\b' deps.txt; then
            echo "::error::abi3 wheel links versioned Python DLL (python3XX.dll)"
            grep -Ei '\bpython3[0-9]+\.dll\b' deps.txt
            exit 1
          fi
          if ! grep -iq '\bpython3\.dll\b' deps.txt; then
            echo "::error::abi3 wheel does not link python3.dll"
            exit 1
          fi
          echo "OK: extension links python3.dll only"

      - name: Test wheel
        run: |
          pip install dist/oefp-*.whl
          pytest tests/python/ -v -s

      - name: List built artifacts
        run: |
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x64
          path: dist/*.whl
          retention-days: 2

  # Collect all wheels into a single artifact
  collect-wheels:

    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: List all wheels
        run: |
          ls -la wheels/

      - name: Upload combined wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: wheels/*.whl
          retention-days: 2

  # A cp310-abi3 wheel claims to load on every Python it supports without a
  # rebuild. Nothing else in this workflow tests that claim: the build jobs
  # compile and test under 3.11 only, so an accidental dependency on a
  # version-specific C API would ship undetected. Importing the built wheels at
  # both ends of the supported range tests it without a build matrix, which
  # would defeat the point of abi3. Installing the wheel by itself also
  # exercises its declared dependencies, so a pyarrow pin that no longer
  # resolves to the Arrow the extension was linked against fails here.
  abi3-smoke:
    needs: collect-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            wheel_glob: dist/oefp-*manylinux*x86_64.whl
          - os: ubuntu-latest
            python: '3.14'
            wheel_glob: dist/oefp-*manylinux*x86_64.whl
          - os: ubuntu-24.04-arm
            python: '3.14'
            wheel_glob: dist/oefp-*manylinux*aarch64.whl
          - os: macos-latest
            python: '3.14'
            wheel_glob: dist/oefp-*macosx*.whl
          - os: windows-latest
            python: '3.14'
            wheel_glob: dist/oefp-*win_amd64.whl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: all-wheels
          path: dist/

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Import wheel under Python ${{ matrix.python }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "openeye-toolkits==${{ env.OPENEYE_VERSION }}" \
            --extra-index-url https://pypi.anaconda.org/openeye/simple \
            --no-cache-dir
          WHEEL=$(ls ${{ matrix.wheel_glob }})
          echo "Installing $WHEEL"
          pip install "$WHEEL"
          python -c "import pyarrow; print('resolved pyarrow', pyarrow.__version__)"
          python -c "import oefp, sys; print('oefp', oefp.__version__, 'imported under', sys.version)"

  # Publish to PyPI on release tags
  publish:

    needs: [collect-wheels, abi3-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: all-wheels
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # For TestPyPI, uncomment:
          # repository-url: https://test.pypi.org/legacy/
